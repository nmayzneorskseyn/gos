бет. Тубаның ішкі жағына коррозиядан қорғау үшін екі қабат лак бүркіледі."}, {"q": "Алюминий тубаға өнім құйылып болғаннан кейін оның артқы бөлігі қалай жабылады?", "o": ["Қосарланған бүктеме құлыппен қысылады", "Бұрандалы шыны қақпақпен бұралады", "Қаңылтыр түбімен дәнекерленіп жабылады", "Резеңке тығынмен сыртынан бекітіледі", "Қағаз таспамен бірнеше рет оралады"], "a": 0, "e": "42-бет. Тубаның ашық артқы бөлігі өнім құйылған соң қосарланған құлыппен қысылады."}, {"q": "Кітапта шыны консерві банкаларының мойын жиегі қандай жабу түрлеріне бөлінеді?", "o": ["Домалатып бекіту, қысып бекіту және бұрандалы бекіту", "Желімдеп бекіту, дәнекерлеп бекіту және түйреуішпен бекіту", "Бүктеп бекіту, тігіп бекіту және жіппен байлап бекіту", "Балқытып бекіту, қағып бекіту және сыммен байлап бекіту", "Қыстырғышпен бекіту, шегелеп бекіту және желіммен бекіту"], "a": 0, "e": "43-бет. I типі домалатып, II типі қысып, III типі бұрандалы жабуға арналған."}, {"q": "Сыйымдылығы 1000 см³-ге дейінгі шыны банкалар термиялық сынақта қандай температура айырмасына төзуі керек?", "o": ["45 °C", "25 °C", "30 °C", "35 °C", "40 °C"], "a": 0, "e": "44-бет. 1000 см³-ге дейінгі банкалар үшін температура айырмасы 45 °C."}, {"q": "Сыйымдылығы 1000 см³-ден асатын шыны банкалар термиялық сынақта қандай температура айырмасына төзуі керек?", "o": ["40 °C", "20 °C", "25 °C", "30 °C", "35 °C"], "a": 0, "e": "44-бет. 1000 см³-ден үлкен банкалар үшін температура айырмасы 40 °C."}, {"q": "Полимер пакеттерді картон қораптың ішіне орналастыруға негізделген қаптама түрі қалай сипатталады?", "o": ["Иілгіш қапты сыртқы қораппен біріктіретін қаптама", "Шыны ыдысты металл қаңылтырмен біріктіретін қаптама", "Ағаш бөшкені шыны қақпақпен біріктіретін қаптама", "Қаңылтыр банканы ағаш тығынмен біріктіретін қаптама", "Қағаз қапты шыны түтікпен біріктіретін қаптама"], "a": 0, "e": "44-бет. «Қорап ішіндегі қап» механикалық зақымнан қорғау мен тасымалдауды жеңілдетуге арналған."}, {"q": "Шырындарды фольгалы картоннан жасалған ерзімін ұзартады.", "Тыныс алу кезінде жылу бөлінеді; желдету жылуды және газдарды әкетуге көмектеседі.", "Салқын қоймадан кейін біртіндеп жылыту шикізат бетінде конденсат түзілуін азайтады."], "questions": [{"q": "Жұмсақ құрылымды жидектер мен ұсақ сүйекті жемістерді зауытқа жеткізуде қандай ыдыс қолданылатыны көрсетілген?", "o": ["40–50 кг сыйымды жабық металл және болат жәшіктер", "80–100 кг сыйымды ірі пластик және болат контейнерлер", "350–400 кг сыйымды ірі ағаш және металл контейнерлер", "8–10 кг сыйымды шағын ағаш және шпон жәшіктер", "20–25 кг сыйымды ірі металл және болат жәшіктер"], "a": 3, "e": "48-бет: жұмсақ жидектер мен ұсақ сүйекті жемістерге 8–10 кг шағын жәшіктер қолданылады."}, {"q": "Жасыл бұршақ дәндерін су құйылған цистернада тасымалдағанда дән мен судың арақатынасы қандай?", "o": ["2 : 1", "1 : 2", "3 : 1", "1 : 3", "4 : 1"], "a": 0, "e": "48-бет: дән мен су арақатынасы 2:1."}, {"q": "Алғашқы өңдеу пункттерінде алынған қызанақ пульпасы мен ұсақталған жемістерге қандай талап қойылады?", "o": ["Тасымалдау уақытын арттырып, шикізатты табиғи жағдайда пісіру", "Тасымалдау уақытын көбейтіп, өнімді желдетусіз сақтау", "Тасымалдау уақытын қысқартып, негізгі зауытта дереу өңдеу", "Тасымалдау уақытын ұзартып, негізгі зауытта ұзақ сақтау", "Тасымалдау уақытын өзгертіп, шикізатты ашық алаңда кептіру"], "a": 2, "e": "48-бет: жартылай фабрикаттар қысқа мерзімде жеткізіліп, дереу өңделеді."}, {"q": "Консерві зауытына жеткізілген шикізатты қабылдауда зертхананың қорытындысы не үшін негіз болады?", "o": ["Жинау әдісін, егіс алқабын және тұқым сортын белгілеуге", "Тасымал бағытын, жәшік түрін және көлік маркасын белгілеуге", "Қойма құрылысын, желдеткіш санын және цех аумағын белгілеуге", "Өсіру мерзімін, суару әдісін және тыңайтқыш түрін белгілеуге", "Қабылдау шешімін, тауарлық сортын және төлем бағасын белгілеуге"], "a": 4, "e": "49-бет: орташа сынама зерттеліп, қабылдау, сорт және баға анықталады."}, {"q": "Шикізатты тасымалдауға арналған жәшіктерді хлорлы су қшаулауы арқылы 1–3 °C ұсталады."}, {"q": "Жемістердің тыныс алу коэффициенті қандай шамалардың қатынасы арқылы анықталады?", "o": ["Бөлінген CO₂ мөлшерінің сіңірілген O₂ мөлшеріне қатынасы", "Сіңірілген CO₂ мөлшерінің бөлінген O₂ мөлшеріне қатынасы", "Бөлінген су мөлшерінің сіңірілген қант мөлшеріне қатынасы", "Сіңірілген су мөлшерінің бөлінген қант мөлшеріне қатынасы", "Бөлінген жылу мөлшерінің сіңірілген су мөлшеріне қатынасы"], "a": 0, "e": "52-бет: тыныс алу коэффициенті бөлінген CO₂ / сіңірілген O₂."}, {"q": "Сақтау кезінде анаэробты тыныс алудан этил спирті мен ацетальдегид жиналуы қандай салдарға әкеледі?", "o": ["Жасушадағы қант көбейіп, шикізаттың тыныс алуы тоқтайды", "Жасуша ферменттері жойылып, шикізаттың түсі тұрақтанады", "Жасуша қызметі бұзылып, шикізаттың бұзылуы жылдамдайды", "Жасуша қызметі күшейіп, шикізаттың сақталуы ұзарады", "Жасуша қабықшасы нығайып, шикізаттың пісуі тоқтайды"], "a": 2, "e": "53-бет: спирт пен ацетальдегид жиналуы жасушаларды зақымдап, табиғи қорғанысты төмендетеді."}, {"q": "Сақтау барысында жемістердің климактериялық тыныс алуының күрт күшеюі қандай заттың жиналуымен байланысты?", "o": ["Этанолдың", "Глюкозаның", "Сахарозаның", "Крахмалдың", "Этиленнің"], "a": 4, "e": "53-бет: этилен пісу гормоны ретінде климактериялық тыныс алуды күшейтеді."}, {"q": "Шикізат қабатына берілетін ауа мөлшері қандай жағдайда белсенді желдету деп есептеледі?", "o": ["180–200 м³/(т·сағ)", "50–100 м³/(т·сағ)", "10–20 м³/(т·сағ)", "25–40 м³/(т·сағ)", "120–150 м³/(т·сағ)"], "a": 1, "e": "53-бет: белсенді желдетуде 50–100 м³/(т·сағ) ауа беріледі."}, {"q": "Салқын қоймадан шығарылған шикізатты біртіндеп жылыту қандай құбылыстың алдын алу үшін ұсынылады?", "o": ["Шикізат қабығында тұздың толық жиналуының", "Шикізат жасушасында майдың толық ыдырауының", "Шикізат құрамында крахмалдың толық түзілуінің", "Шикізат бетінде ылғалдың конденсациялануының", "Шикізат құрамында қанттың толық кристалдануының"], "a": 3, "e": "54-бет: жылыту беткі конденсацияны және соған байланысты бұзылуды болдырмайды."}, {"q": "Сақтаудан кейін шикізатты жылыту кезінде ауаның салыстырмалы ылғалдылығы қандай аралықта ұсталады?", "o": ["75–80 %", "55–60 %", "60–65 %", "65–70 %", "85–90 %"], "a": 0, "e": "54-бет: жылыту кезіндегі салыстырмалы ылғалдылық 75–80 %."}, {"q": "Қатты құрылымды шикізатты гидротранспортермен бергенде су мен шикізаттың арақатынасы қандай?", "o": ["2 : 3 немесе 2 : 4", "4 : 3 немесе 4 : 2", "3 : 1 немесе 4 : 1", "1 : 3 немесе 1 : 4", "1 : 1 немесе 2 : 1"], "a": 2, "e": "54-бет: су мен шикізат арақатынасы 3:1 немесе 4:1."}, {"q": "Гидротранспортер бойындағы арнайы қалталар қандай мақсатта орнатылады?", "o": ["Шикізат құрамындағы қантты еріту үшін", "Шикізаттың пісіп-жетілуін тездету үшін", "Жемістердің түсін біркелкі өзгерту үшін", "Өнім құрамындағы қышқылды азайту үшін", "Ауыр бөгде қоспаларды ұстап қалу үшін"], "a": 4, "e": "54-бет: қалта-тұтқыштар ауыр қоспаларды ұстайды."}]}, {"title": "5-тарау. Шикізатты консервілеуге бастапқы дайындау, сұрыптау, жуу және тазалау", "pages": "55–65", "theory": ["Инспекция жарамсыз шикізатты бөліп алады; сұрыптау түсі мен пісу дәрежесі бойынша, калибрлеу өлшемі бойынша жүргізіледі.", "Жуу кезінде топырақ қалдықтары мен ластану жойылады; машиналар шикізаттың механикалық беріктігіне сай таңдалады.", "Тазалау механикалық, бумен, бу-сумен және химиялық әдістермен жүргізіледі.", "Бумен тазалау кезінде қабық пен оның астындағы жұқа қабат қызады; сілтімен тазалауда протопектин ыдырайды."], "questions": [{"q": "Консервілеуге дайындауда инспекция мен сұрыптаудың негізгі айырмашылығы қандай?", "o": ["Инспекция жемістерді өлшеміне қарай бөледі, сұрыптау қабығын абразивпен тазалайды", "Инспекция жемістерді ыстық сумен жуады, сұрыптау сүйектерін механикалық бөледі", "Инспекция жемістерді буға қыздырады, сұрыптау химиялық ерітіндімен өңдейді", "Инспекция жемістерді кептіруге жібереді, сұрыптау ылғалды вакууммен бөледі", "Инспекция жарамсыз жемістерді алып тастайды, сұрыптау түсі мен пісу дәрежесі бойынша бөледі"], "a": 4, "e": "55-бет: инспекцияда шіріген, зақымданған жемістер мен қоспалар алынады; сұрыптауда түсі мен пісу дәрежесі ескеріледі."}, {"q": "Консерві шикізатындағы зақымданған жемістерді инспекцияда алып тастаудың стерильдеу режиміне қатысты себебі қандай?", "o": ["Стерильдеу режимдері қаптама түсіне тәуелді болғандықтан, инспекция ыдыс сапасын анықтайды", "Стерильдеу режимдері шикізат бағасына тәуелді болғандықтан, инспекция өзіндік құнды анықтайды", "Стерильдеу режимдері стандартты шикізатқа есептелгендіктен, бүлінген жемістер ақау қаупін арттырады", "Стерильдеу режимдері бүлінген шикізатқа есептелгендіктен, сау жемістер ақау қаупін арттырады", "Стерильдеу режимдері жеміс өлшеміне тәуелсіз болғандықтан, инспекция тек сыртқы көрініске әсер етеді"], "a": 2, "e": "55-бет: стандартты шикізатқа есептелген режимге бүлінген жемістердің түсуі дайын өнім ақауын арттыруы мүмкін."}, {"q": "Инспекциялық таспалы конвейердің кітапта көрсетілген қозғалыс жылдамдығы қандай?", "o": ["0,05–0,10 м/с", "0,15–0,20 м/с", "0,25–0,30 м/с", "0,35–0,40 м/с", "0,45–0,50 м/с"], "a": 0, "e": "55-бет: инспекция конвейері 0,05–0,1 м/с жылдамдықпен қозғалады."}, {"q": "Инспекция кезінде шикізатты конвейерге бір қабат етіп орналастырудың негізгі себебі қандай?", "o": ["Жуу суының ағын жылдамдығын тұрақты деңгейде сақтау", "Жемістердің жылумен өңдеу кезіндегі пісуін жылдамдату", "Жемістердің механикалық қабық аршу кезіндегі үйкелісін арттыру", "Төменгі қатардағы жемістердің қараусыз қалуына жол бермеу", "Жемістердің калибрлеу кезінде фракцияларға бөлінуін тоқтату"], "a": 3, "e": "56-бет: көп қабат жүктеу төменгі жемістерді тексеруді қиындатады."}, {"q": "Жасыл бұршақты пісу дәрежесіне қарай тұз ерітіндісінде сұрыптау қандай физикалық қасиетке негізделеді?", "o": ["Дәндердің магниттік қасиет айырмашылығына", "Дәндердің меншікті тығыздығының айырмашылығына", "Дәндердің сыртқы бетінің түс айырмашылығына", "Дәндердің сыртқы пішінінің айырмашылығына", "Дәндердің механикалық беріктік айырмашылығына"], "a": 1, "e": "56-бет: тығыз дәндер батады, тығыздығы төмендері қалқып шығады."}, {"q": "Электрондық сұрыптау кезінде қызанақтың жарамсыз фракциясын бөліп шығару қандай белгіге сүйенеді?", "o": ["Жеміс тығыздығын тұз ерітіндісімен салыстыруға", "Жеміс диаметрін барабан тесігімен салыстыруға", "Жеміс массасын серіппелі таразымен салыстыруға", "Жеміс қаттылығын қысым датчигімен салыстыруға", "Жеміс түсін эталондық жарық сүзгісімен салыстыруға"], "a": 4, "e": "56-бет: электрондық жүйе жеміс түсін эталондық сүзгімен салыстырып, ауытқығанын бөледі."}, {"q": "Консерві шикізатын өлшемі бойынша калибрлеу жылумен өңдеу процесіне қалай ықпал етеді?", "o": ["Әртүрлі шикізат жылумен өңдеу температурасын өлшемеуге мүмкіндік береді", "Біркелкі шикізат жылумен өңдеу жабдығын қолданбауға мүмкіндік береді", "Біркелкі шикізат жылумен өңдеу режимін дәлірек сақтауға мүмкіндік береді", "Әртүрлі шикізат жылумен өңдеу режимін бірдей сақтауға мүмкіндік береді", "Біркелкі шикізат жылумен өңдеу кезеңін толық алып тастауға мүмкіндік береді"], "a": 2, "e": "56-бет: калибрлеу біркелкі шикізат алып, жылумен өңдеу режимін дәл ұстауға көмектеседі."}, {"q": "Барабанды калибрлеу машинасында жемістер фракцияларға қандай тәсілмен бөлінеді?", "o": ["Айналмалы барабандағы диаметрі біртіндеп ұлғаятын тесіктер арқылы", "Айналмалы барабандағы қашықтығы біртіндеп ұлғаятын тростар арқылы", "Айналмалы барабандағы қысымы біртіндеп өсетін су ағыны арқылы", "Айналмалы барабандағы температурасы біртіндеп өсетін бу арқылы", "Айналмалы барабандағы түсі біртіндеп өзгеретін сүзгілер арқылы"], "a": 0, "e": "56-бет: барабан бетіндегі тесіктердің диаметрі шикізат қозғалысы бағытында өседі."}, {"q": "Тросты калибрлеу машинасында жемістердің өлшем бойынша бөлінуі қалай жүреді?", "o": ["Тростар жылдамдығы артқан сайын алдымен жұмсақ, кейін қатты жемістер төмен түседі", "Тростар температурасы артқан сайын алдымен піскен, кейін жасыл жемістер төмен түседі", "Тростар ылғалдылығы артқан сайын алдымен ауыр, кейін жеңіл жемістер төмен түседі", "Тростар аралығы ұлғайған сайын алдымен ұсақ, кейін ірі жемістер төмен түседі", "Тростар аралығы азайған сайын алдымен ірі, кейін ұсақ жемістер төмен түседі"], "a": 3, "e": "57-бет: тростар аралығы біртіндеп кеңейіп, ұсақтан іріге қарай фракциялар бөлінеді."}, {"q": "Тамыржемістерді қалақты жуу машинасында өңдегенде механикалық зақымдану қаупі неден туындайды?", "o": ["Жарық сүзгісінің жемістерді түске қарай бөлуінен", "Айналмалы қалақтардың шикізатпен тікелей жанасуынан", "Ауамен барботаждаудың шикізатты жоғары көтеруінен", "Су бүріккішінің жемістерді ерітіндіге батыруынан", "Тростар аралығының шикізат өлшеміне сай өзгеруінен"], "a": 1, "e": "57–58-беттер: қалақты жуғыштың кемшілігі - қалақтардың жемісті механикалық зақымдауы."}, {"q": "Қызанақ пен алманы желдеткішті жуу машинасында өңдегенде барботаж қандай қызмет атқарады?", "o": ["Шикізат қабығын сілтімен химиялық жолмен ерітеді", "Жемістерді өлшемі бойынша бірнеше фракцияға бөледі", "Шикізатты бу қысымымен қысқа мерзімде қыздырады", "Жемістердің сүйегін механикалық жолмен ығыстырады", "Су ішінде қарқынды жібіту мен жууға жағдай жасайды"], "a": 4, "e": "58-бет: желдеткіштен келген ауа барботаж арқылы судағы жібіту мен жууды күшейтеді."}, {"q": "Жуу-дірілдету машинасындағы елеуіш бетінің төрт функционалдық аймағы қалай ұйымдастырылған?", "o": ["Тазалау, екі мәрте булау және соңғы стерильдеу", "Ұсақтау, екі мәрте сүзу және соңғы қоюлату", "Жібіту, екі мәрте жуу және соңғы шаю", "Сұрыптау, екі мәрте кептіру және соңғы салқындату", "Калибрлеу, екі мәрте қыздыру және соңғы салқындату"], "a": 2, "e": "59-бет: төрт аймақ - жібіту, екі жуу аймағы және шаю."}, {"q": "Қызанақты флотациялық гидронауада алдын ала жуу кітап бойынша ластанудың қандай үлесін кетіреді?", "o": ["82–84 %", "62–64 %", "72–74 %", "92–94 %", "52–54 %"], "a": 0, "e": "61-бет: флотациялық гидронауа қызанақ бетіндегі ластанудың 82–84 %-ын жояды."}, {"q": "КНА-600М үздіксіз картоп тазалағышының негізгі жұмыс мүшелері қанда а қалыпқа келіп, қарсы ұшы ісінеді немесе қайтадан ісінеді"], "a": 4, "e": "137-бет: хлопуша кезінде бір ұш басылса қарсы ұш ісінеді немесе ісіну қайта пайда болады."}, {"q": "Бомбажды банканы дірілдейтін ұшты банкадан ажырататын белгі қандай?", "o": ["Ісіну банка салқындағанда бірден басылады", "Ісіну саусақпен басқанда өзгермей тұрақты сақталады", "Ісіну саусақпен басқанда жойылып қайта пайда болмайды", "Ісіну бөлме температурасына келгенде толық жойылады", "Ісіну саусақпен басқанда қарсы ұшқа ауысады"], "a": 1, "e": "137-бет: бомбаж кезінде ыдыстың ісінуі тұрақты және басқанда өзгермейді."}, {"q": "Микробиологиялық ақауды бағалауда бір партия өнімінің pH мәніндегі қандай ауытқу қалыпты деп берілген?", "o": ["±0,8", "±1,0", "±1,5", "±0,2", "±0,5"], "a": 3, "e": "138-бет: бір шикізат партиясынан жасалған консервілерде pH ауытқуы ±0,2 шегінде болады."}, {"q": "Консервінің сыртқы көрінісі бұзылмағанымен қауіпті микроорганизмдер болуы мүмкін жағдай қайсы?", "o": ["pH 4,2–4,5 өнімде шіріткіш немесе протеолитикалық анаэробтар болғанда", "pH 2,0–2,2 өнімде қант кристалдары түзілгенде", "pH 3,0–3,2 өнімде табиғи пигменттер өзгергенде", "pH 5,5–5,7 өнімде крахмал толық желімденгенде", "pH 6,0–6,2 өнімде пектин мөлшері жоғарылағанда"], "a": 0, "e": "138-бет: pH 4,2–4,5 консервілерде анаэробтар, соның ішінде ботулизм қоздырғыштары, сыртқы белгісіз кездесуі мүмкін."}, {"q": "Микробиологиялық ақаудың стерильдеу режиміне байланысты себебі қандай?", "o": ["Өнімнің стандартты ыдысқа дұрыс құйылуы", "Шикізаттың қабылдау кезінде өлшенуі", "Нақты летальдылықтың қажетті деңгейден төмен болуы", "Нақты летальдылықтың қажетті деңгейден едәуір жоғары болуы", "Банканың сыртқы бетінің толық құрғақ болуы"], "a": 2, "e": "138-бет: қажетті летальдылық қамтамасыз етілмесе микробиологиялық ақау пайда болуы мүмкін."}, {"q": "Микробиологиялық ақауға әкелетін жабдыққа қатысты фактор қайсы?", "o": ["Автоклавтағы банкалардың дұрыс орналасуы және аспаптардың тексерілуі", "Автоклавтағы қысымның бақыла let chapter=0,mode='quiz',answers={},revealed={},finished=false;const letters='ABCDE';
function data(){return CHAPTERS[chapter].questions}
function selectChapter(i){chapter=i;resetAll();drawNav();document.getElementById('theory').innerHTML='<h2>'+CHAPTERS[i].title+'</h2><p class="muted">Кітап беттері: '+CHAPTERS[i].pages+' · '+data().length+' сұрақ</p><h3>Маңызды мәліметтер</h3><ul>'+CHAPTERS[i].theory.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function drawNav(){document.getElementById('chapters').innerHTML=CHAPTERS.map((x,i)=>'<button class="'+(i===chapter?'active':'')+'" onclick="selectChapter('+i+')">'+(i+1)+'-тарау</button>').join('')}
function setMode(m){mode=m;resetAll();document.getElementById('quizTab').classList.toggle('active',m==='quiz');document.getElementById('testTab').classList.toggle('active',m==='test')}
function resetAll(){answers={};revealed={};finished=false;document.getElementById('result').classList.add('hidden');render()}
function choose(i,j){if(finished||(mode==='quiz'&&revealed[i]))return;answers[i]=j;if(mode==='quiz')revealed[i]=true;render()}
function render(){let DATA=data();document.getElementById('modeInfo').textContent=mode==='quiz'?'Quiz: жауап таңдаған соң түсіндірме көрсетіледі.':'Test: барлық жауаптарды белгілеп, нәтижені тексеріңіз.';document.getElementById('finish').style.display=mode==='test'?'inline-block':'none';let root=document.getElementById('questions');root.innerHTML='';DATA.forEach((x,i)=>{let card=document.createElement('article');card.className='card';let meta=document.createElement('div');meta.className='number';meta.textContent='Сұрақ '+(i+1)+' / '+DATA.length;card.appendChild(meta);let title=document.createElement('h2');title.textContent=(i+1)+'. '+x.q;card.appendChild(title);x.o.forEach((opt,j)=>{let label=document.createElement('label');label.className='choice';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=answers[i]===j;input.disabled=finished||(mode==='quiz'&&revealed[i]);input.addEventListener('change',()=>choose(i,j));label.append(input,document.createTextNode(letters[j]+') '+opt));card.appendChild(label)});if(revealed[i]||finished){let p=document.createElement('div');p.className='answer'+(answers[i]===x.a?'':' wrong');p.textContent=(answers[i]===x.a?'Дұрыс. ':'Дұрыс жауап: '+letters[x.a]+'. ')+x.e;card.appendChild(p)}root.appendChild(card)})}
function finishTest(){let DATA=data();if(mode!=='test')return;if(Object.keys(answers).length<DATA.length){alert('Барлық сұраққа жауап беріңіз.');return}finished=true;let score=DATA.filter((x,i)=>answers[i]===x.a).length;let el=document.getElementById('result');el.classList.remove('hidden');el.textContent='Нәтиже: '+score+' / '+DATA.length+' ('+Math.round(score/DATA.length*100)+'%).';render();el.scrollIntoView({behavior:'smooth',block:'center'})}
selectChapter(0);
